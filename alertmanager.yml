route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 30s
  receiver: 'web.hook'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'https://webhook.site/8e7a6c69-8aa6-4d98-9606-59496a25344d'

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['instance']